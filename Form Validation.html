<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Form Validation</title>
<link href="CSS/Form Validation.css" rel="stylesheet" type="text/css">
<link href="CSS/All Background Color & Image.css" rel="stylesheet" type="text/css">
<link href="CSS/Typography.css" rel="stylesheet" type="text/css">
<link href="CSS/Keyboard Navigation.css" rel="stylesheet" type="text/css">
<script src="JS/Keyboard Navigation.js" defer></script>
<style>
	h2{
		color: white;
		width: 70%;
		text-align: center;
		margin-top: 90px;
		font-size: 40px;
		padding-bottom: 20px;
		}
	body{
		margin: 0px 0px 0px 0px;
	}
	.field{
		text-align: center;
		font-size: 20px;
		color: white;
	}
	#name{
		border-radius: 15px;
	}
	#email{
		border-radius: 15px;
	}
	#password{
		border-radius: 15px;
	}
	#confirm{
		border-radius: 15px;
	}
	button{
		border-radius: 15px;
	}
	p{
		text-align: center;
		padding-bottom: 5px;
	}
	
</style>
</head>
<body>

<h2>Sign Up</h2>

<form id="signupForm">

<div class="field">
<label>Name:</label><br>
<input id="name" type="text" placeholder="Your name">
<p id="nameError" class="error"></p>
</div>

<div class="field">
<label>Email:</label><br>
<input id="email" type="text" placeholder="name@example.com">
<p id="emailError" class="error"></p>
</div>

<div class="field">
<label>Password:</label><br>
<input id="password" type="password" placeholder="Min 8 characters">
<p id="passwordError" class="error"></p>
</div>

<div class="field">
<label>Confirm Password:</label><br>
<input id="confirm" type="password" placeholder="Repeat password">
<p id="confirmError" class="error"></p>
</div>

<p><button type="submit">Create Account</button></p>

</form>

<p id="result"></p>

<script src="JS/Form Validation.js"></script>

</body>
</html>
